name: kit-gallery

# main → `registry.hansenexus.dev/design/kit-gallery:<sha>`, the public @hansenexus/ui kit gallery
# as a static-server image (Dockerfile) behind tools/access-proxy, the Cloudflare Access JWT check
# (#47). hn-infra infrastructure/design pins the sha and serves it
# at design.hansenexus.dev/ behind Cloudflare Access (hn-infra#248); that README holds the image
# contract this job smoke-tests: port 8080, uid 101, read-only root, only /tmp writable.
# Pull requests that touch the image inputs build and smoke-test it without pushing, so a broken
# Dockerfile is red on its PR rather than on main. Shape copied from blaupause images.yml.
#
# Hosted runner, not the Hetzner fleet (dec_2026-09-17_global-ci-on-hetzner-fleet-no-hosted-minutes
# exception): this repo is public, so hosted minutes are free and outside the org budget, and a
# self-hosted runner on a public repo would run fork pull requests on an estate host. ci.yml
# makes the same choice.
#
# Per-PR previews (design#150): a pull request from this repository also pushes its image as
# `kit-gallery:pr-<N>`; hn-infra's kit-previews pod (infrastructure/design) pulls every pr-* tag
# and serves it at design.hansenexus.dev/pr/<N>/, behind the same Access app and access-proxy.
# Closing the PR deletes the tag, and the pod drops the preview. Gated by the repository
# variable KIT_PREVIEWS_ENABLED=true, so nothing is pushed before the pod exists.
#
# App screens from private repositories (design#148) are checked out with a read-only token of
# the workbench GitHub App (variable WORKBENCH_APP_ID, secret WORKBENCH_APP_KEY; contents:read
# on the app repositories only), never for a fork's pull request. Without the app the gallery
# skips those apps and says so. The live theme packs (design#149) come from main's themes/,
# extracted here because the image build has no .git.
#
# NEVER write GitHub's literal skip-ci marker (square brackets, "skip ci") in a PR description:
# the squash commit takes the PR body as its message and GitHub then skips this workflow on main.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - Dockerfile
      - kit-gallery.sws.toml
      - .dockerignore
      - .github/workflows/kit-gallery.yml
      - bun.lock
      - package.json
      - "packages/**"
      - "themes/**"
      - "workbench/**"
      - "brand/assets/**"
      - "tools/access-proxy/**"
  workflow_dispatch:

# One main run at a time, never cancelled: each sha gets its image. A pull request's runs group
# by its number, never by github.ref: for a closed PR github.ref is the base branch, so the
# closed run would join main's group and cancel the merge's own image build (design#158).
# A newer push to the PR cancels its older run; the closed run (tag cleanup) is never cancelled.
concurrency:
  group: kit-gallery-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

permissions:
  contents: read

env:
  REGISTRY: registry.hansenexus.dev
  IMAGE: registry.hansenexus.dev/design/kit-gallery
  # For the Cache-Control smoke only; the image under test has no curl.
  CURL_IMAGE: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69

jobs:
  image:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Push only from main, and only once the registry is wired up: an unset variable is a
      # deliberate "not yet" that reads clearly, an unset secret a baffling 401.
      PUSH: ${{ github.ref == 'refs/heads/main' && vars.HARBOR_PUSH_ENABLED == 'true' }}
      # A pull request's preview: only from this repository (a fork has no secrets), only once
      # hn-infra serves previews.
      PREVIEW: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.HARBOR_PUSH_ENABLED == 'true' && vars.KIT_PREVIEWS_ENABLED == 'true' }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The live copy of every theme pack (design#149, packages/ui/scripts/live.ts) is main's
      # themes/. The image has no .git, so it reads this extracted copy and its SOURCE label.
      - name: Main's theme packs for the live copies
        run: |
          set -euo pipefail
          live=workbench/.checkouts/_live
          mkdir -p "$live"
          git fetch -q --depth=1 origin main
          git archive FETCH_HEAD themes | tar -x -C "$live"
          echo "main $(git rev-parse --short FETCH_HEAD)" > "$live/SOURCE"
          cat "$live/SOURCE"

      # Private app screens (design#148): a read-only token of the workbench GitHub App, never
      # for a fork. workbench-checkout.ts sends it as a header for the fetch only and removes
      # .git, so the token reaches neither the disk nor the image.
      - name: Workbench app token
        id: app-token
        if: vars.WORKBENCH_APP_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.WORKBENCH_APP_ID }}
          private-key: ${{ secrets.WORKBENCH_APP_KEY }}
          owner: hansenexus
          repositories: fachwerk,hn-monorepo
          permission-contents: read

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.app-token.outcome == 'success'

      - name: Check out the app screens
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bun packages/ui/scripts/workbench-checkout.ts

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Harbor
        if: env.PUSH == 'true' || env.PREVIEW == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Tagged by commit sha only, never `latest`: hn-infra pins an explicit tag.
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: kit-gallery
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=kit-gallery
          cache-to: type=gha,mode=max,scope=kit-gallery
          provenance: false

      # Real team domain: the proxy fetches the JWKS at startup, which the smoke exercises too. No
      # token can be minted here, so the valid-token path lives in the Go unit tests.
      - name: Smoke test under the deployment's constraints
        run: |
          set -euo pipefail
          docker run -d --name kit-gallery -p 8080:8080 \
            --read-only --tmpfs /tmp --user 101:101 --cap-drop ALL \
            --security-opt no-new-privileges \
            -e CF_ACCESS_TEAM_DOMAIN=hansenexus.cloudflareaccess.com -e CF_ACCESS_AUD=smoke \
            "$IMAGE:$GITHUB_SHA"
          trap 'docker logs kit-gallery; docker rm -f kit-gallery >/dev/null' EXIT
          base=http://127.0.0.1:8080
          for _ in $(seq 1 20); do curl -fs -o /dev/null "$base/health" && break; sleep 0.5; done
          expect() { # expect <status> <curl args...>
            want=$1; shift
            got=$(curl -sS -o /dev/null -w '%{http_code}' "$@")
            echo "$got $*"
            [ "$got" = "$want" ] || { echo "::error::want $want, got $got for $*"; exit 1; }
          }
          # The probe path answers without a token; everything else needs one.
          expect 200 "$base/health"
          expect 200 -I "$base/health"
          expect 403 "$base/"
          expect 403 "$base/dist/main.js"
          expect 403 -X POST "$base/health"
          expect 403 -H 'Cf-Access-Jwt-Assertion: not.a.token' "$base/"
          [ -z "$(curl -sS "$base/")" ] || { echo "::error::403 carries a body"; exit 1; }
          # Behind the proxy the files need a token, so check them in the image instead: the page
          # and everything it loads, fonts and brand files included (self-contained).
          site="$RUNNER_TEMP/site"; mkdir -p "$site"
          docker cp kit-gallery:/public/. "$site"
          test -s "$site/index.html" || { echo "::error::missing index.html"; exit 1; }
          # The JS and CSS names carry a content hash (#50): take them from index.html.
          refs=$(grep -oE '(href|src)="\./dist/[^"]+"' "$site/index.html" | sed -E 's#.*"\./(.*)"#\1#')
          for kind in 'main\.[0-9a-f]{10}\.js' 'gallery\.[0-9a-f]{10}\.css' 'fonts\.[0-9a-f]{10}\.css'; do
            grep -qxE "dist/$kind" <<<"$refs" || { echo "::error::index.html has no dist/$kind"; exit 1; }
          done
          for f in $refs dist/brand/favicon.svg; do
            test -s "$site/$f" || { echo "::error::missing $f"; exit 1; }
          done
          fonts=$(grep -xE 'dist/fonts\.[0-9a-f]{10}\.css' <<<"$refs")
          grep -oE 'url\(\./fonts/[^)]+\)' "$site/$fonts" | sed -E 's#url\(\./(.*)\)#\1#' \
            | while read -r font; do test -s "$site/dist/$font" || { echo "::error::missing $font"; exit 1; }; done
          echo "fonts: every url() in $fonts is in the image"
          # Cache-Control from kit-gallery.sws.toml (#52), asked of static-web-server itself on
          # 127.0.0.1:8081 (behind the proxy everything but /health needs a token). The image has
          # no shell or curl, so curl runs in a container sharing its network namespace.
          js=$(grep -xE 'dist/main\.[0-9a-f]{10}\.js' <<<"$refs")
          font=$(grep -oE 'url\(\./fonts/[^)]+\)' "$site/$fonts" | sed -E 's#url\(\./(.*)\)#\1#' | head -1)
          cache_control() { # cache_control <want> <path>
            got=$(docker run --rm --network container:kit-gallery "$CURL_IMAGE" -sSI "http://127.0.0.1:8081$2" \
              | tr -d '\r' | awk 'tolower($1) == "cache-control:" { sub(/^[^:]*: */, ""); print }')
            echo "$2: ${got:-<none>}"
            [ "$got" = "$1" ] || { echo "::error::want Cache-Control '$1' for $2, got '${got:-<none>}'"; exit 1; }
          }
          cache_control 'no-cache' /
          cache_control 'no-cache' /index.html
          cache_control 'public, max-age=86400' "/$js"
          cache_control 'public, max-age=86400' "/$fonts"
          cache_control 'public, max-age=3600' "/dist/$font"
          cache_control 'public, max-age=3600' /dist/brand/favicon.svg
          cache_control '' /nope

      - name: Push
        if: env.PUSH == 'true'
        run: docker push "$IMAGE:$GITHUB_SHA"

      # The preview tag moves with the PR's head; hn-infra's kit-previews pod picks it up.
      - name: Push the preview
        if: env.PREVIEW == 'true'
        run: |
          set -euo pipefail
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:pr-$PR"
          docker push "$IMAGE:pr-$PR"
          echo "Preview of ${GITHUB_SHA::12}: https://design.hansenexus.dev/pr/$PR/ (live within a few minutes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Note that nothing was pushed
        if: github.ref == 'refs/heads/main' && env.PUSH != 'true'
        run: |
          echo "::warning title=Image not pushed::Built design/kit-gallery:${GITHUB_SHA} but did not \
          push it. Needs the private Harbor project 'design', a push robot as the HARBOR_USERNAME / \
          HARBOR_PASSWORD secrets and the repository variable HARBOR_PUSH_ENABLED=true \
          (hn-infra infrastructure/design/README.md, bring-up step 1)."

  # A closed pull request's preview goes: its pr-<N> tag is deleted in Harbor, and the
  # kit-previews pod drops what it no longer finds. Harbor's retention and GC remove the image.
  # The push robot needs delete on the design project; a missing tag is fine.
  preview-cleanup:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.KIT_PREVIEWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the pr tag
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          url="https://$REGISTRY/api/v2.0/projects/design/repositories/kit-gallery/artifacts/pr-$PR/tags/pr-$PR"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" -X DELETE "$url")
          echo "DELETE pr-$PR: $code"
          case "$code" in
            200|404) ;;
            *) echo "::error::deleting kit-gallery:pr-$PR answered $code"; exit 1 ;;
          esac
