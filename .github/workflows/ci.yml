name: ci

# `CI Result` is the one required check on main (ruleset). It aggregates every
# job, so adding a job never needs a ruleset change: add it to `needs`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Ratchet (no raw palette values outside packages/tokens)
        run: bun run ratchet
      # Before typecheck: packages import each other through dist/ types (ui reads tokens).
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Contrast (WCAG 2.2 AA, every semantic pair, dark and light)
        run: bun run contrast
      - name: Test
        run: bun run test

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Pack, install and compile with Tailwind v4
        working-directory: packages/tokens
        run: bun run build && scripts/smoke.sh "$RUNNER_TEMP/smoke"

  screenshots:
    # Baselines are pixels, so they render in the same pinned image as scripts/screenshots.sh
    # uses locally. Bump the tag together with @playwright/test in packages/ui.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Bun (the image has no unzip for setup-bun)
        run: npm install --global bun@1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Screenshots at 390 and 1280 px, dark and light
        working-directory: packages/ui
        run: bun run screenshots
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshot-diffs
          path: |
            packages/ui/test-results/
            packages/ui/playwright-report/
          retention-days: 7

  go:
    # tools/access-proxy, the Cloudflare Access JWT check in front of the gallery images (#47).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/access-proxy
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: tools/access-proxy/go.mod
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  swift:
    # Compiles and tests the SwiftPM package. Linux covers the Foundation-free token
    # values; macOS also builds the SwiftUI adapters and compiles them for iOS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build for iOS
        if: runner.os == 'macOS'
        run: |
          # Xcode names the package scheme itself (not after the product); read it.
          xcodebuild -list -json | tee schemes.json
          scheme=$(python3 -c 'import json; s=json.load(open("schemes.json"))["workspace"]["schemes"]; print(next((x for x in s if x.endswith("-Package")), s[0]))')
          xcodebuild build -scheme "$scheme" -destination 'generic/platform=iOS' -quiet

  workflow-policy:
    # Workflow baseline and zizmor (hn-infra#528), mode block. A vendored copy of hn-infra's
    # workflow-policy-v1: a public repo cannot call a private repo's reusable workflow
    # (.github/workflow-policy/README.md). Same steps as hn-infra's action.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZIZMOR_VERSION: "1.30.1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Baseline policy
        run: |
          uv run --no-project --with 'pyyaml==6.0.3' python .github/workflow-policy/workflow_policy.py \
            --mode block --annotate --summary "$GITHUB_STEP_SUMMARY" .github/workflows
      - name: zizmor
        if: ${{ !cancelled() }}
        run: |
          uvx "zizmor@${ZIZMOR_VERSION}" --offline --no-progress --config .github/workflow-policy/zizmor.yml \
            --format github --min-severity medium --min-confidence medium .github/workflows

  result:
    name: CI Result
    if: always()
    needs: [check, package, screenshots, go, swift, workflow-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "$NEEDS"
          if [ "$FAILED" = "true" ]; then
            echo "::error::a required job did not pass"
            exit 1
          fi
