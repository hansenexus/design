name: ci

# `CI Result` is the one required check on main (ruleset). It aggregates every
# job, so adding a job never needs a ruleset change: add it to `needs`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Ratchet (no raw palette values outside packages/tokens)
        run: bun run ratchet
      # Before typecheck: packages import each other through dist/ types (ui reads tokens).
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Contrast (WCAG 2.2 AA, every semantic pair, dark and light)
        run: bun run contrast
      - name: Test
        run: bun run test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Pack, install and compile with Tailwind v4
        working-directory: packages/tokens
        run: bun run build && scripts/smoke.sh "$RUNNER_TEMP/smoke"

  screenshots:
    # Baselines are pixels, so they render in the same pinned image as scripts/screenshots.sh
    # uses locally. Bump the tag together with @playwright/test in packages/ui.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: Bun (the image has no unzip for setup-bun)
        run: npm install --global bun@1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Screenshots at 390 and 1280 px, dark and light
        working-directory: packages/ui
        run: bun run screenshots
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: |
            packages/ui/test-results/
            packages/ui/playwright-report/
          retention-days: 7

  swift:
    # Compiles and tests the SwiftPM package. Linux covers the Foundation-free token
    # values; macOS also builds the SwiftUI adapters and compiles them for iOS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build for iOS
        if: runner.os == 'macOS'
        run: |
          # Xcode names the package scheme itself (not after the product); read it.
          xcodebuild -list -json | tee schemes.json
          scheme=$(python3 -c 'import json; s=json.load(open("schemes.json"))["workspace"]["schemes"]; print(next((x for x in s if x.endswith("-Package")), s[0]))')
          xcodebuild build -scheme "$scheme" -destination 'generic/platform=iOS' -quiet

  result:
    name: CI Result
    if: always()
    needs: [check, package, screenshots, swift]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::a required job did not pass"
            exit 1
          fi
