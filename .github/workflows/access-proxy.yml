name: access-proxy

# main → `registry.hansenexus.dev/design/access-proxy:<sha>`, the shared Cloudflare Access JWT
# check (tools/access-proxy, #47) as a scratch image holding only the static binary and the CA
# bundle it needs to fetch the JWKS. Not run on its own: gallery images take it whole,
#   COPY --from=registry.hansenexus.dev/design/access-proxy:<sha> / /
#   ENTRYPOINT ["/usr/local/bin/access-proxy", "--", "/static-web-server"]
# as hansenexus/design-ops does for lotse-gallery (design-ops#14). This repo's kit-gallery builds
# the same stage from source instead (Dockerfile target access-proxy).
# Pull requests that touch the proxy build and smoke-test it without pushing. Shape copied from
# kit-gallery.yml, which also explains the hosted runner and the skip-ci warning (never write
# GitHub's literal skip-ci marker in a PR description).

on:
  # Every main sha, like kit-gallery: any sha a consumer pins has its image.
  push:
    branches: [main]
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/access-proxy.yml
      - "tools/access-proxy/**"
  workflow_dispatch:

# One main run at a time, never cancelled: each sha gets its image.
concurrency:
  group: access-proxy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: registry.hansenexus.dev
  IMAGE: registry.hansenexus.dev/design/access-proxy

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Push only from main, and only once the registry is wired up (see kit-gallery.yml).
      PUSH: ${{ github.ref == 'refs/heads/main' && vars.HARBOR_PUSH_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Tagged by commit sha only, never `latest`: consumers pin an explicit tag.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: access-proxy
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=access-proxy
          cache-to: type=gha,mode=max,scope=access-proxy
          provenance: false

      # The image is a file carrier, so the smoke checks its contents and that the binary runs
      # and refuses to start unconfigured. Request handling is covered by the Go tests (ci.yml)
      # and end to end by kit-gallery.yml.
      - name: Smoke test
        run: |
          set -euo pipefail
          id=$(docker create "$IMAGE:$GITHUB_SHA")
          trap 'docker rm "$id" >/dev/null' EXIT
          files=$(docker export "$id" | tar -t | grep -v '/$' | grep -vE '^(\.dockerenv|dev/|proc/|sys/|etc/(hostname|hosts|mtab|resolv\.conf)$)' | sort)
          echo "$files"
          [ "$files" = "$(printf 'etc/ssl/certs/ca-certificates.crt\nusr/local/bin/access-proxy')" ] \
            || { echo "::error::unexpected image contents"; exit 1; }
          if out=$(docker run --rm --read-only --user 101:101 "$IMAGE:$GITHUB_SHA" -- /bin/true 2>&1); then
            echo "::error::started without CF_ACCESS_TEAM_DOMAIN / CF_ACCESS_AUD"; exit 1
          fi
          echo "$out"
          grep -q 'CF_ACCESS_TEAM_DOMAIN and CF_ACCESS_AUD must both be set' <<<"$out"

      - name: Push
        if: env.PUSH == 'true'
        run: docker push "$IMAGE:$GITHUB_SHA"

      - name: Note that nothing was pushed
        if: github.ref == 'refs/heads/main' && env.PUSH != 'true'
        run: |
          echo "::warning title=Image not pushed::Built design/access-proxy:${GITHUB_SHA} but did not \
          push it. Needs HARBOR_PUSH_ENABLED=true and the Harbor push secrets (see kit-gallery.yml)."
