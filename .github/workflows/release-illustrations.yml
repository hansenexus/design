name: release-illustrations

# Publishes @hansenexus/illustrations to npm with provenance over Trusted Publishing
# (OIDC, no NPM_TOKEN). Same shape as release.yml (tokens). @hansenexus/tokens is a
# peer dependency and ships from release.yml on its own `tokens-v*` tag.
#
# npm side (npmjs.com > @hansenexus/illustrations > Settings > Trusted Publisher):
#   Organization hansenexus, Repository design, Workflow release-illustrations.yml,
#   Allowed actions: npm publish.
#
# Trigger: push an `illustrations-v<version>` tag. The workflow refuses a tag that disagrees
# with packages/illustrations/package.json. workflow_dispatch with dry_run packs and validates
# without publishing.

on:
  push:
    tags: ["illustrations-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-illustrations
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # GitHub release
      id-token: write # provenance attestation
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm supporting OIDC
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile

      - name: Tag and packages/illustrations/package.json agree
        if: startsWith(github.ref, 'refs/tags/illustrations-v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#illustrations-v}"
          pkg=$(node -p "require('./packages/illustrations/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag illustrations-v$tag does not match packages/illustrations/package.json $pkg"
            exit 1
          fi

      # Root build: the tests render the motifs and gzip the built dist/<motif>.js (<= 3 KB).
      - name: Gate
        run: bun run build && bun run contrast && bun run test

      - name: Pack
        working-directory: packages/illustrations
        run: npm pack --dry-run

      # Already on npm with the same contents (a re-run): skip. Different contents: fail.
      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        working-directory: packages/illustrations
        run: $GITHUB_WORKSPACE/scripts/npm-publish.sh

      # A collision with the published version counts as success here only; see the script.
      - name: Publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        working-directory: packages/illustrations
        run: $GITHUB_WORKSPACE/scripts/npm-publish.sh --dry-run

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/illustrations-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::GitHub release $GITHUB_REF_NAME already exists. Skipping."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
