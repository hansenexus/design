name: release-state-check

# Publishes @hansenexus/state-check to npm with provenance over Trusted Publishing
# (OIDC, no NPM_TOKEN). Same shape as release.yml (tokens).
#
# npm side (npmjs.com > @hansenexus/state-check > Settings > Trusted Publisher):
#   Organization hansenexus, Repository design, Workflow release-state-check.yml,
#   Allowed actions: npm publish.
#
# Trigger: push a `state-check-v<version>` tag. The workflow refuses a tag that disagrees
# with package.json. workflow_dispatch with dry_run packs and validates without publishing.

on:
  push:
    tags: ["state-check-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and validate, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-state-check
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      id-token: write # provenance attestation
    defaults:
      run:
        working-directory: packages/state-check
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm supporting OIDC
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile

      - name: Tag and package.json agree
        if: startsWith(github.ref, 'refs/tags/state-check-v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#state-check-v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag state-check-v$tag does not match package.json $pkg"
            exit 1
          fi

      - name: Gate
        run: bun run build && bun test tests

      - name: Smoke (pack, install the tarball, run the bin under Node)
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          tgz=$(ls "$RUNNER_TEMP"/hansenexus-state-check-*.tgz)
          dir="$RUNNER_TEMP/smoke"
          mkdir -p "$dir/app/app/[id]"
          printf 'export default function P() { return null; }\n' > "$dir/app/app/[id]/page.tsx"
          cd "$dir" && npm init -y >/dev/null && npm install "$tgz"
          set +e
          npx state-check --app app
          code=$?
          set -e
          test "$code" = 1

      - name: Publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npm publish --access public --provenance

      - name: Publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --access public --dry-run

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/state-check-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
