name: release-ui

# A GitHub release carrying the packed @hansenexus/tokens and @hansenexus/ui, so consumers
# can install a tagged version before npm trusted publishing is attached (design#6):
#
#   bun add https://github.com/hansenexus/design/releases/download/ui-v0.2.0/hansenexus-tokens-0.4.0.tgz \
#           https://github.com/hansenexus/design/releases/download/ui-v0.2.0/hansenexus-ui-0.2.0.tgz
#
# Trigger: push a `ui-v<version>` tag. The workflow refuses a tag that disagrees with
# packages/ui/package.json. No npm publish here; that stays in release.yml (tokens-v*).

on:
  push:
    tags: ["ui-v*"]

permissions:
  contents: read

concurrency:
  group: release-ui
  cancel-in-progress: false

jobs:
  tarball:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile

      - name: Tag and packages/ui/package.json agree
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#ui-v}"
          pkg=$(bun -p "require('./packages/ui/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ui-v$tag does not match packages/ui/package.json $pkg"
            exit 1
          fi

      - name: Gate
        run: bun run build && bun run contrast && bun run test

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          for pkg in tokens ui; do
            (cd "packages/$pkg" && bun pm pack --destination "$RUNNER_TEMP/pack")
          done
          ls -l "$RUNNER_TEMP/pack"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/pack/*.tgz \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
